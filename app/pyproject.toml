[project]
name = "merck-med-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pratap V", email = "vpratapchoudary@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chainlit>=2.12.0",
    "click>=8.5.0",
    "fastapi[standard]>=0.141.1",
    "langchain-core>=1.6.2",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "pinecone>=9.1.0",
    "pypdf>=6.16.2",
    "sentence-transformers>=6.0.1",
    "unicorn>=2.1.4",
]

[project.scripts]
vectorize-pdf = "backend.vectors.vectorize_cli:vectorize_pdf"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "backend"
module-root = "src"

[tool.setuptools]
# Use a src layout so packages are discovered under the `src/` directory.
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
