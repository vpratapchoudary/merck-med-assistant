name: Vectorizer Pipeline

on:
  workflow_dispatch:
    inputs:
      file_path:
        description: 'Path to the PDF file to be vectorized'
        required: true
        default: 'src/merck_med_assistant/data/medical_diagnosis_manual.pdf'

env:
  PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  input_file_path: ${{ github.event.inputs.file_path }}

jobs:
  vectorize_pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync --frozen

      - name: Run vectorizer script
        run: |
          uv run vectorize-pdf --input_file ${input_file_path}